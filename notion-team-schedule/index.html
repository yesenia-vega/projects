<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Global Team Schedule</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #F5F4F6;
      color: #05092E;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .app { width: 100%; max-width: 780px; background: #fff; border-radius: 16px; border: 0.5px solid rgba(5,9,46,0.1); overflow: hidden; display: flex; flex-direction: column; }

    /* ── Header ── */
    .header { background: #05092E; padding: 1.25rem 1.5rem; }
    .title-block { display: flex; flex-direction: column; gap: 2px; margin-bottom: 1.25rem; }
    .title-eyebrow { font-size: 10px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: #91FFD7; }
    .title-main { font-size: 22px; font-weight: 700; color: #F5F4F6; letter-spacing: -0.3px; line-height: 1.15; }
    .title-line { width: 36px; height: 3px; background: #91FFD7; border-radius: 2px; margin-top: 4px; }
    .header-btns { display: flex; gap: 10px; flex-wrap: wrap; }
    .hbtn { border-radius: 8px; padding: 9px 16px; font-size: 13px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 7px; font-family: inherit; transition: opacity 0.15s; white-space: nowrap; }
    .hbtn:hover { opacity: 0.85; }
    .hbtn-online { background: #743AED; color: #fff; border: none; }
    .hbtn-schedules { background: rgba(255,255,255,0.08); color: #F5F4F6; border: 0.5px solid rgba(255,255,255,0.2); }
    .hbtn-schedules.active { background: rgba(255,255,255,0.16); border-color: rgba(255,255,255,0.4); }
    .pulse { width: 7px; height: 7px; border-radius: 50%; background: #91FFD7; flex-shrink: 0; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(1.35)} }

    /* ── Default empty state ── */
    .default-state { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.75rem; padding: 3.5rem 2rem; min-height: 320px; }
    .default-hint { font-size: 13px; color: #aaa; text-align: center; max-width: 360px; line-height: 1.6; }

    /* ── Online panel ── */
    .online-panel { padding: 1.25rem 1.5rem; border-bottom: 0.5px solid rgba(5,9,46,0.06); }
    .online-panel h3 { font-size: 12px; font-weight: 500; color: #666; margin-bottom: 0.6rem; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .online-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .online-chip { display: flex; align-items: center; gap: 5px; background: #F5F4F6; border: 0.5px solid rgba(145,255,215,0.6); border-radius: 8px; padding: 5px 12px; font-size: 12px; cursor: pointer; color: #05092E; font-family: inherit; transition: background 0.15s; }
    .online-chip:hover { background: #ebe9f0; }
    .online-chip-dot { width: 6px; height: 6px; border-radius: 50%; background: #91FFD7; }
    .none-msg { font-size: 12px; color: #aaa; font-style: italic; }
    .local-time { font-size: 11px; color: #bbb; margin-left: auto; }

    /* ── Schedule view ── */
    .schedule-view { display: flex; flex: 1; min-height: 420px; }
    .sidebar { background: #05092E; width: 150px; flex-shrink: 0; padding: 1.25rem 0.875rem; display: flex; flex-direction: column; gap: 4px; border-right: 0.5px solid rgba(255,255,255,0.06); }
    .sidebar-label { font-size: 10px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(245,244,246,0.3); padding: 0 6px; margin-bottom: 6px; }
    .s-tab { border-radius: 8px; padding: 7px 8px; font-size: 13px; display: flex; align-items: center; gap: 7px; color: rgba(245,244,246,0.5); cursor: pointer; transition: all 0.15s; border: none; background: none; font-family: inherit; text-align: left; width: 100%; }
    .s-tab:hover { background: rgba(255,255,255,0.06); color: rgba(245,244,246,0.8); }
    .s-tab.active { background: rgba(116,58,237,0.25); color: #F5F4F6; font-weight: 500; }
    .s-tab.online-highlight { border: 0.5px solid rgba(145,255,215,0.35); }
    .s-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .s-online-dot { width: 6px; height: 6px; border-radius: 50%; background: #91FFD7; margin-left: auto; flex-shrink: 0; }
    .main { flex: 1; padding: 1.5rem; background: #F5F4F6; display: flex; flex-direction: column; gap: 1rem; }
    .tz-bar { display: flex; align-items: center; gap: 8px; }
    .tz-bar label { font-size: 12px; color: #888; white-space: nowrap; }
    .tz-bar select { background: #fff; border: 0.5px solid rgba(5,9,46,0.15); border-radius: 8px; padding: 6px 10px; font-size: 12px; color: #05092E; font-family: inherit; cursor: pointer; outline: none; flex: 1; }

    /* ── Card ── */
    .card { background: #fff; border: 0.5px solid rgba(5,9,46,0.08); border-radius: 12px; padding: 1.25rem; flex: 1; }
    .card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 1rem; padding-bottom: 0.875rem; border-bottom: 0.5px solid rgba(5,9,46,0.06); }
    .avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 500; font-size: 14px; flex-shrink: 0; }
    .card-name { font-size: 16px; font-weight: 600; color: #05092E; }
    .card-sub { font-size: 12px; color: #999; margin-top: 2px; }
    .card-tz { margin-left: auto; font-size: 11px; color: #999; background: #F5F4F6; padding: 3px 8px; border-radius: 6px; border: 0.5px solid rgba(5,9,46,0.08); white-space: nowrap; }
    .online-badge { margin-left: 8px; display: inline-flex; align-items: center; gap: 4px; background: rgba(145,255,215,0.2); color: #0a6040; border-radius: 6px; padding: 2px 8px; font-size: 11px; font-weight: 500; }
    .day-grid { display: flex; flex-direction: column; gap: 8px; }
    .day-row { display: flex; align-items: flex-start; gap: 10px; font-size: 13px; }
    .day-row.active-row { background: rgba(145,255,215,0.08); border-radius: 8px; padding: 4px 8px; margin: 0 -8px; border: 0.5px solid rgba(145,255,215,0.25); }
    .day-name { width: 34px; color: #bbb; font-weight: 500; font-size: 12px; flex-shrink: 0; padding-top: 3px; }
    .day-shift { flex: 1; }
    .day-off { color: #ddd; font-style: italic; padding-top: 3px; font-size: 12px; }
    .shift-pill { display: inline-block; background: rgba(116,58,237,0.08); color: #743AED; border-radius: 6px; padding: 3px 10px; font-size: 12px; font-weight: 500; }
    .shift-pill.active-shift { background: rgba(145,255,215,0.2); color: #0a6040; }
    .shift-hrs { font-size: 11px; color: #bbb; margin-top: 2px; }
    .error-state { padding: 2rem 1.5rem; color: #999; font-size: 13px; text-align: center; }

    @media (max-width: 560px) {
      .schedule-view { flex-direction: column; }
      .sidebar { width: 100%; flex-direction: row; flex-wrap: wrap; padding: 0.75rem; gap: 6px; border-right: none; border-bottom: 0.5px solid rgba(255,255,255,0.06); }
      .sidebar-label { display: none; }
      .s-tab { width: auto; }
      .header-btns { flex-direction: column; }
    }
  </style>
</head>
<body>
<div class="app">

  <!-- Header: always visible -->
  <div class="header">
    <div class="title-block">
      <span class="title-eyebrow">Global Team</span>
      <span class="title-main">Schedule</span>
      <div class="title-line"></div>
    </div>
    <div class="header-btns">
      <button class="hbtn hbtn-online" onclick="handleOnlineClick()">
        <span class="pulse"></span> Who's online now?
      </button>
      <button class="hbtn hbtn-schedules" id="schedules-btn" onclick="handleSchedulesClick()">
        &#9776; Schedules
      </button>
    </div>
  </div>

  <!-- Online panel: shown when "Who's online?" clicked -->
  <div id="online-panel" style="display:none"></div>

  <!-- Default empty state: shown until a button is clicked -->
  <div id="default-state" class="default-state">
    <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="20" cy="20" r="19.5" stroke="rgba(5,9,46,0.08)"/>
      <circle cx="15" cy="16" r="4" stroke="#bbb" stroke-width="1.5"/>
      <circle cx="25" cy="16" r="4" stroke="#bbb" stroke-width="1.5"/>
      <path d="M8 30c0-4 3.13-7 7-7h10c3.87 0 7 3 7 7" stroke="#bbb" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <p class="default-hint">Click <strong>Who's online now?</strong> to see who's currently working, or <strong>Schedules</strong> to view the full team schedule.</p>
  </div>

  <!-- Schedule view: shown when "Schedules" clicked -->
  <div id="schedule-view" class="schedule-view" style="display:none">
    <div class="sidebar">
      <div class="sidebar-label">Members</div>
      <div id="sidebar-tabs">
        <div style="padding:8px 6px;font-size:11px;color:rgba(245,244,246,0.3);">Loading...</div>
      </div>
    </div>
    <div class="main">
      <div class="tz-bar">
        <label for="tz">Viewing in</label>
        <select id="tz" onchange="renderCard()">
          <option value="America/Chicago">Chicago</option>
          <option value="America/Sao_Paulo">São Paulo</option>
          <option value="Europe/Malta">Malta</option>
          <option value="Asia/Manila">Manila</option>
          <option value="UTC">UTC</option>
        </select>
      </div>
      <div id="card-area">
        <div class="card">
          <div style="display:flex;align-items:center;justify-content:center;padding:2rem;color:#bbb;font-size:13px;">
            Select a member from the sidebar.
          </div>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbydHOmrs7BoJIjjoAAulyDYsfAhTXzktw66kmN5iAS2AGN-bpxXJlf4ERiTVIgdElo_mw/exec';

  const MEMBER_CONFIG = {
    'Yesenia': { color: '#8B9DC3', initials: 'YC', location: 'CHI' },
    'Ollie':   { color: '#7BC87B', initials: 'OE', location: 'EU — Malta' },
    'Wemerson':{ color: '#6BC9A0', initials: 'WB', location: 'BRZ — São Paulo' },
    'Romer':   { color: '#E8C56A', initials: 'RP', location: 'PH — Manila' },
    'Mando':   { color: '#A89CC8', initials: 'MP', location: 'PH — Manila' }
  };

  const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  let MEMBERS = [];
  let activeMember = 0;
  let onlineSet = new Set();
  let scheduleVisible = false;

  // ─── TIMEZONE HELPERS ─────────────────────────────────────────────────────
  function getTZLabel(ianaZone) {
    if (ianaZone === 'UTC') return 'UTC';
    try {
      const parts = new Intl.DateTimeFormat('en-US', { timeZone: ianaZone, timeZoneName: 'short' }).formatToParts(new Date());
      const abbr = parts.find(function(p) { return p.type === 'timeZoneName'; });
      return abbr ? abbr.value : ianaZone;
    } catch(e) { return ianaZone; }
  }

  function getUTCOffset(ianaZone) {
    if (ianaZone === 'UTC') return 0;
    try {
      const now = new Date();
      const utcDate = new Date(now.toLocaleString('en-US', { timeZone: 'UTC' }));
      const tzDate  = new Date(now.toLocaleString('en-US', { timeZone: ianaZone }));
      return (tzDate - utcDate) / 3600000;
    } catch(e) { return 0; }
  }

  function updateDropdownLabels() {
    const sel = document.getElementById('tz');
    if (!sel) return;
    const names = { 'America/Chicago':'Chicago', 'America/Sao_Paulo':'São Paulo', 'Europe/Malta':'Malta', 'Asia/Manila':'Manila' };
    Array.from(sel.options).forEach(function(opt) {
      const iana = opt.value;
      if (iana === 'UTC') { opt.text = 'UTC'; return; }
      const lbl    = getTZLabel(iana);
      const offset = getUTCOffset(iana);
      const sign   = offset >= 0 ? '+' : '-';
      opt.text = (names[iana] || iana) + ' — ' + lbl + ' (UTC' + sign + Math.abs(offset) + ')';
    });
  }

  // ─── BUILD MEMBERS ────────────────────────────────────────────────────────
  function buildMembers(rows) {
    const order = [], grouped = {};
    rows.forEach(function(row) {
      const name = (row['Name'] || row['Name '] || '').toString().trim();
      if (!name) return;
      if (!grouped[name]) { grouped[name] = []; order.push(name); }
      grouped[name].push(row);
    });
    return order.map(function(name) {
      const personRows = grouped[name];
      const cfg = MEMBER_CONFIG[name] || { color:'#999', initials: name.slice(0,2).toUpperCase(), location: '' };
      const scheduleUTC = personRows.map(function(row) {
        const day    = (row['Day'] || '').toString().trim();
        const offVal = (row['Off'] || '').toString().trim().toLowerCase();
        const startVal = row['Start '] !== undefined ? row['Start '] : row['Start'];
        const endVal   = row['End']   !== undefined ? row['End']   : row['End'];
        if (offVal === 'off' || startVal === '' || startVal === null || startVal === undefined) {
          return { day: day, off: true };
        }
        return { day: day, start: parseFloat(startVal), end: parseFloat(endVal) };
      });
      return { name, location: cfg.location, color: cfg.color, initials: cfg.initials, scheduleUTC };
    });
  }

  // ─── FETCH ────────────────────────────────────────────────────────────────
  function loadSchedule() {
    fetch(SCRIPT_URL + '?action=getSchedule')
      .then(function(res) { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
      .then(function(data) {
        MEMBERS = buildMembers(data);
        if (!MEMBERS.length) throw new Error('No members found');
        activeMember = 0;
      })
      .catch(function(err) {
        console.error('Failed to load schedule:', err);
        document.getElementById('sidebar-tabs').innerHTML =
          '<div style="padding:8px 6px;font-size:11px;color:rgba(245,244,246,0.3);">Could not load</div>';
        document.getElementById('card-area').innerHTML =
          '<div class="card"><div class="error-state">'
          + '<p style="margin-bottom:8px">Could not load schedule from Google Sheets.</p>'
          + '<button onclick="loadSchedule()" style="margin-top:12px;padding:6px 14px;border-radius:8px;border:0.5px solid rgba(5,9,46,0.15);background:#fff;cursor:pointer;font-size:12px;">Retry</button>'
          + '</div></div>';
      });
  }

  // ─── BUTTON HANDLERS ──────────────────────────────────────────────────────
  function handleOnlineClick() {
    // Hide default state, keep schedule view as-is
    document.getElementById('default-state').style.display = 'none';
    checkOnline();
  }

  function handleSchedulesClick() {
    document.getElementById('default-state').style.display = 'none';
    document.getElementById('online-panel').style.display = 'none';

    const view = document.getElementById('schedule-view');
    const btn  = document.getElementById('schedules-btn');

    if (scheduleVisible) {
      // Toggle off
      view.style.display = 'none';
      btn.classList.remove('active');
      scheduleVisible = false;
      // Show default state again if nothing else is showing
      document.getElementById('default-state').style.display = 'flex';
    } else {
      view.style.display = 'flex';
      btn.classList.add('active');
      scheduleVisible = true;
      updateDropdownLabels();
      renderSidebar();
      renderCard();
    }
  }

  // ─── ONLINE ───────────────────────────────────────────────────────────────
  function getNowUTC() {
    const n = new Date();
    return n.getUTCHours() + n.getUTCMinutes() / 60;
  }

  function isOnline(member) {
    const utcHour   = getNowUTC();
    const utcDayIdx = new Date().getUTCDay();
    return member.scheduleUTC.some(function(s) {
      if (s.off) return false;
      const shiftDayIdx = DAYS.indexOf(s.day);
      const nowAbs = utcDayIdx * 24 + utcHour;
      return nowAbs >= shiftDayIdx * 24 + s.start && nowAbs < shiftDayIdx * 24 + s.end;
    });
  }

  function checkOnline() {
    onlineSet = new Set();
    MEMBERS.forEach(function(m, i) { if (isOnline(m)) onlineSet.add(i); });
    const panel   = document.getElementById('online-panel');
    const timeStr = new Date().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
    if (onlineSet.size === 0) {
      panel.innerHTML = '<div class="online-panel"><h3><span class="pulse" style="background:#aaa;animation:none"></span> Nobody online right now <span class="local-time">your local time: ' + timeStr + '</span></h3><p class="none-msg">Check back later or open Schedules to see upcoming shifts.</p></div>';
    } else {
      let chips = '';
      onlineSet.forEach(function(i) {
        chips += '<button class="online-chip" onclick="jumpToMember(' + i + ')"><span class="online-chip-dot"></span>' + MEMBERS[i].name + '</button>';
      });
      panel.innerHTML = '<div class="online-panel"><h3><span class="pulse"></span> Online now <span class="local-time">your local time: ' + timeStr + '</span></h3><div class="online-list">' + chips + '</div></div>';
    }
    panel.style.display = 'block';
    if (scheduleVisible) { renderSidebar(); renderCard(); }
  }

  // Clicking an online chip opens schedules view on that person
  function jumpToMember(i) {
    activeMember = i;
    if (!scheduleVisible) {
      document.getElementById('schedule-view').style.display = 'flex';
      document.getElementById('schedules-btn').classList.add('active');
      scheduleVisible = true;
      updateDropdownLabels();
    }
    renderSidebar();
    renderCard();
  }

  // ─── SIDEBAR & CARD ───────────────────────────────────────────────────────
  function renderSidebar() {
    let html = '';
    MEMBERS.forEach(function(m, i) {
      const isActive          = i === activeMember ? 'active' : '';
      const isOnlineHighlight = onlineSet.has(i) ? 'online-highlight' : '';
      const onlineDot         = onlineSet.has(i) ? '<span class="s-online-dot"></span>' : '';
      html += '<button class="s-tab ' + isActive + ' ' + isOnlineHighlight + '" onclick="selectMember(' + i + ')">'
            + '<span class="s-dot" style="background:' + m.color + '"></span>' + m.name + onlineDot
            + '</button>';
    });
    document.getElementById('sidebar-tabs').innerHTML = html;
  }

  function selectMember(i) {
    activeMember = i;
    renderSidebar();
    renderCard();
  }

  function fmt(h) {
    const norm = ((h % 24) + 24) % 24;
    const ampm = norm >= 12 ? 'pm' : 'am';
    const hr   = norm % 12 === 0 ? 12 : norm % 12;
    return hr + ampm;
  }

  function renderCard() {
    if (!MEMBERS.length) return;
    const m        = MEMBERS[activeMember];
    const ianaZone = document.getElementById('tz').value;
    const offset   = getUTCOffset(ianaZone);
    const tzLabel  = getTZLabel(ianaZone);
    const memberOnline = onlineSet.has(activeMember);
    const utcNow   = getNowUTC();
    const utcDayIdx = new Date().getUTCDay();

    const dayMap = {}, dayOrder = [];

    m.scheduleUTC.forEach(function(s) {
      const shiftDayIdx = DAYS.indexOf(s.day);
      const nowAbs = utcDayIdx * 24 + utcNow;

      if (s.off) {
        if (!dayMap[s.day]) { dayMap[s.day] = { off: true, shifts: [] }; dayOrder.push(s.day); }
        return;
      }

      const ds  = s.start + offset;
      const de  = s.end   + offset;
      const hrs = s.end   - s.start;

      const startDayOffset = Math.floor(ds / 24);
      const displayDayIdx  = ((shiftDayIdx + startDayOffset) % 7 + 7) % 7;
      const displayDay     = DAYS[displayDayIdx];

      const localStart = ((ds % 24) + 24) % 24;
      const localEnd   = ((de % 24) + 24) % 24;
      const endDayDiff = Math.floor(de / 24) - Math.floor(ds / 24);
      const endNote    = endDayDiff > 0 ? ' (next day)' : endDayDiff < 0 ? ' (prev day)' : '';
      const shiftLabel = fmt(localStart) + ' – ' + fmt(localEnd) + endNote;

      const isActive = memberOnline && nowAbs >= shiftDayIdx * 24 + s.start && nowAbs < shiftDayIdx * 24 + s.end;

      if (!dayMap[displayDay]) { dayMap[displayDay] = { off: false, shifts: [] }; dayOrder.push(displayDay); }
      dayMap[displayDay].off = false;
      dayMap[displayDay].shifts.push({ label: shiftLabel, hrs, isActive });
    });

    let rows = '';
    dayOrder.forEach(function(day) {
      const entry = dayMap[day];
      if (entry.off || entry.shifts.length === 0) {
        rows += '<div class="day-row"><span class="day-name">' + day + '</span><span class="day-off">off</span></div>';
      } else {
        entry.shifts.forEach(function(sh) {
          const activeRow  = sh.isActive ? 'active-row'   : '';
          const activePill = sh.isActive ? 'active-shift' : '';
          const dot        = sh.isActive ? ' ●' : '';
          rows += '<div class="day-row ' + activeRow + '"><span class="day-name">' + day + '</span>'
                + '<div class="day-shift"><span class="shift-pill ' + activePill + '">' + sh.label + dot + '</span>'
                + '<div class="shift-hrs">' + sh.hrs + ' hrs · ' + tzLabel + '</div></div></div>';
        });
      }
    });

    const badge = memberOnline
      ? '<span class="online-badge"><span style="width:5px;height:5px;border-radius:50%;background:#0a6040;display:inline-block;margin-right:3px"></span>online</span>'
      : '';

    document.getElementById('card-area').innerHTML =
      '<div class="card">'
      + '<div class="card-header">'
      + '<div class="avatar" style="background:' + m.color + '18;color:' + m.color + '">' + m.initials + '</div>'
      + '<div><div class="card-name">' + m.name + badge + '</div><div class="card-sub">' + m.location + '</div></div>'
      + '<div class="card-tz">' + tzLabel + '</div>'
      + '</div>'
      + '<div class="day-grid">' + rows + '</div>'
      + '</div>';
  }

  // ─── INIT ─────────────────────────────────────────────────────────────────
  loadSchedule();
</script>
</body>
</html>
